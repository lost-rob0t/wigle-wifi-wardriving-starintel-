def releaseKeystore = System.getenv("STARINTEL_ANDROID_KEYSTORE")
def releaseKeystorePassword = System.getenv("STARINTEL_ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("STARINTEL_ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("STARINTEL_ANDROID_KEY_PASSWORD")
def hasReleaseSigning = releaseKeystore && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword

apply plugin: 'com.android.application'

android {
    namespace "net.wigle.wigleandroid.starintelwear"
    compileSdk = 36

    defaultConfig {
        applicationId "net.wigle.wigleandroid"
        minSdkVersion 30
        targetSdkVersion 36
        versionCode 1
        versionName "0.1.0"
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        starintelRelease {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystore)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.starintelRelease
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.wear:wear:1.3.0'
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation 'androidx.wear.watchface:watchface-complications-data-source:1.2.1'
}
